# The Glass Fortress backend suite, on every pull request.
#
# WHY IT EXISTS. Until now the suite ran on a laptop, before a PR, because
# somebody remembered to run it. That is the same shape as every other rule this
# repository has had to convert into a control: read, agreed with, and eventually
# skipped. Here the runner does it, and with branch protection it becomes a
# required check rather than a habit.
#
# WHY THIS ONE CAN PASS, unlike the gate retired on 2026-08-30. `integrity:check`
# compared a committed artifact against a rebuild that embeds `git rev-parse HEAD`,
# so the commit landing the artifact changed the thing it was stamped with and no
# passing state existed. A test suite has no such fixed point.
#
# NODE 22 IS DELIBERATE AND IS ITSELF A CHECK. The backend declares
# `engines.node >= 22`; local development has been running 20. If the suite fails
# here and passes locally, the declaration is wrong — which is worth knowing.
#
# `prisma generate` IS EXPLICIT because nothing in the install lifecycle runs it —
# only `npm run build` does, and a clean checkout has no generated client. Locally
# it survives in node_modules from an earlier build, which is exactly the kind of
# ambient state a fresh runner exists to remove.
#
# THE FRONTEND SUITE IS ITS OWN JOB (UI refactor plan UI-1, 2026-09-15). The Glass
# Fortress frontend's jest project — the harness and the instruments every page step
# adds — runs as `glass-fortress-frontend`, so a red frontend case names its job. It
# carries no `paths:` filter on purpose: once it is a required check, a job that does
# not run on a pull request never reports, and that pull request cannot merge.
name: tests

on:
  pull_request:
    branches: [staging, master]

jobs:
  glass-fortress-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate
        working-directory: apps/glass-fortress/backend

      # THE SUITE DOES NOT TYPE-CHECK. `npm run test:gf` is `jest --selectProjects …`, and
      # jest transpiles types away, so `tsc` has never run in this job. The workspace
      # already HAS the command — `build` is `prisma generate && tsc --project
      # tsconfig.json` — so this step CALLS it rather than spelling `tsc` a second time.
      # Its `tsconfig` include is `['src/**/*', 'scripts/**/*']`, which is what makes
      # "operational scripts are COMPILED, not interpreted" (CLAUDE.md) a fact about the
      # runner rather than a rule someone remembers.
      #
      # YES, THIS RE-RUNS `prisma generate` — about five seconds, duplicating the step
      # above. That is deliberate and is not worth shaving: inlining `tsc` here to avoid
      # it would be a second spelling of one command, and the `scripts/**/*` coverage
      # would be lost the first time the two drifted. The step above stays because its
      # own comment explains why a clean checkout needs it at all.
      - name: Type-check, including the operational scripts
        run: npm run build
        working-directory: apps/glass-fortress/backend

      # EVERY PROJECT, ONE REQUIRED RUN (thesis refactor plan step 25's remainder, 2026-09-15). `npm test` runs `unit`,
      # `extraction`, and the three acceptance suites — `walk` (refactor plan step 0), `evidence` (steps 11-16) and `thesis`
      # (thesis steps 17-26) — each written from its design's appendix BEFORE the code and red by design until the step
      # that built what it names. They ran in a separate non-gating job while they were red; all three are green on every
      # file, so a red case in any of them now blocks the merge. `thesis` joining is the step's own text; `walk` and
      # `evidence` join on the researcher's ruling of the same day (no plan step asked for them, none held them back).
      # The `document` suite joins at document refactor plan step 36.
      - name: Run the suite
        run: npm run test:gf

      # A RATCHET, NOT A SWEEP. `eslint src/` exits 1 today, so running it here
      # directly would install a permanently red required check — the defect
      # retired the same day this was written. This compares per-rule counts
      # against a recorded baseline, so the steady state is green and the debt
      # cannot grow unnoticed while the cleanup PRs are still queued.
      - name: Lint debt may not grow
        run: npm run lint:ratchet

  glass-fortress-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A SUITE IS NOT A GATE. This job has run `jest` and nothing else — no type-check,
      # no lint, no build — so a change could be green here and broken in three ways at
      # once. MEASURED, not argued: UI-7's D-B4 decoy passed `jest` 261/261 while `tsc`
      # exited 2 on a property that no longer existed. That error would have come
      # through this job GREEN and landed.
      #
      # `working-directory` IS LOAD-BEARING, not tidiness: `eslint` from the repo root
      # exits 127, which reads as "no findings", and `tsc` needs the workspace's own
      # `tsconfig.json`. A check that cannot fail is worse than no check at all.
      #
      # THE BUILD NEEDS NO ENVIRONMENT, and the EXIT CODE is the evidence: with
      # `.env.local` moved aside and the shell stripped to PATH and HOME,
      # `npm run build` — `check:guide && next build` — exits 0. The explanation is the
      # route table: of its 34 rows, 32 are `ƒ` (server-rendered on demand) and the two
      # that DO prerender, `/_not-found` and `/icon.png`, read no backend. So no page
      # reads `BACKEND_URL` while building. No variable is added here and no secret is
      # invented; if a page is ever made static AND made to read, this is the comment
      # that stops being true, and the build will say so before a reader does.
      #
      # THE ORDER IS FREE: `tsc --noEmit` passes with no `.next/` directory at all,
      # measured with it moved aside, because nothing under `src/` or `test/` uses the
      # generated `PageProps<…>` / `LayoutProps<…>` / `RouteContext<…>` helpers — so
      # `.next/types/**/*.ts` in `tsconfig` matches nothing tsc needs. A page that used
      # one would make the build a precondition of the type-check; this note is where to
      # look if that day comes. The two static checks run FIRST only for feedback speed.
      # THE TYPE-CHECK CANNOT RUN ON A CLEAN CHECKOUT WITHOUT THIS, and PR #526 is how we
      # found out — the first run of the step above failed in 45s with:
      #
      #   src/components/AuthShell.tsx(6,23): error TS2307:
      #     Cannot find module '../../public/teder-dove.png' or its corresponding type declarations.
      #   src/components/HeroSection.tsx(6,27): the same
      #
      # `next-env.d.ts` is what declares a `*.png` import as a module — its second line is
      # `/// <reference types="next/image-types/global" />` — and it is GENERATED by `next
      # dev` / `next build` and **gitignored** (`.gitignore` :42). So every laptop has one
      # and a clean `npm ci` checkout has none: THE FRONTEND HAS NEVER BEEN TYPE-CHECKABLE
      # FROM A FRESH CLONE, and nothing could have shown that until a type-check ran
      # somewhere the file was absent.
      #
      # MEASURED BY BOTH SEATS, by deleting `next-env.d.ts` AND moving `.next/` aside:
      # `tsc` exits 2 with exactly the two errors above; `npx next typegen` exits 0 and
      # regenerates the file byte-for-byte; `tsc` then exits 0.
      #
      # DO NOT DELETE THIS AS REDUNDANT WITH THE BUILD. `next build` would also generate
      # it, but it costs ~40s against this step's seconds, and moving it first would throw
      # away the fast-feedback order the steps are in. DO NOT COMMIT `next-env.d.ts`
      # either: Next's own convention ignores it, and its third line imports
      # `./.next/types/routes.d.ts`, which a clean checkout equally does not have.
      - name: Generate Next's type definitions
        run: npx next typegen
        working-directory: apps/glass-fortress/frontend

      - name: Type-check
        run: npx tsc --noEmit
        working-directory: apps/glass-fortress/frontend

      # LINT LANDS AT ZERO, which is the argument for landing it NOW: the frontend's last
      # four warnings left with UI-7's rewrite of `app/[locale]/theses/page.tsx`. A step
      # added at zero costs nothing and holds it there; the same step in a month is a debt
      # to adopt or a second ratchet to build. The backend's ratchet never covered this
      # workspace — `tools/lint-ratchet/check.mjs` :40 targets `glass-fortress-backend` —
      # so there has never been anything here to catch a frontend regression.
      # `--max-warnings=0` IS THE GATE, and without it this step is a label. MEASURED, by
      # both seats independently: with an unused variable planted in `src/lib/format.ts`,
      # `npm run lint` exits **0** — eslint's exit code ignores warnings — while every
      # other gate in this workflow also stayed green (tsc 0, build 0, backend 0). The
      # four warnings this step was landed to hold at zero were `no-unused-vars`, THE
      # SAME RULE as that plant. With the flag the fault exits 1 and the clean tree still
      # exits 0, so it gates without installing a permanently red check.
      - name: Lint, at zero and held there
        run: npm run lint -- --max-warnings=0
        working-directory: apps/glass-fortress/frontend

      - name: Run the frontend suite
        run: npm run test:gf:frontend

      - name: Build
        run: npm run build
        working-directory: apps/glass-fortress/frontend
